name: Real AI qualification
on:
  workflow_dispatch:
    inputs:
      model:
        description: Local model to qualify
        required: true
        default: qwen2.5:0.5b
        type: choice
        options:
          - qwen2.5:0.5b
          - qwen2.5:1.5b
permissions:
  contents: read
jobs:
  real-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      YARDWORK_AI_MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start the application and the actual local-model engine
        run: docker compose -f compose.yaml -f compose.ai.yaml up --build -d --wait --wait-timeout 600
      - name: Record engine version and model identity
        run: |
          docker compose -f compose.yaml -f compose.ai.yaml exec -T ollama ollama --version
          docker compose -f compose.yaml -f compose.ai.yaml exec -T ollama ollama list
      - name: Qualify natural language, section editing, and saved geometry
        run: node --import tsx scripts/ai-smoke.ts
      - name: Logs for failed qualification
        if: failure()
        run: docker compose -f compose.yaml -f compose.ai.yaml logs --no-color
      - name: Clean up this isolated runner
        if: always()
        run: docker compose -f compose.yaml -f compose.ai.yaml down -v
