name: Checks
on:
  push:
    branches: [main, staging]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Save a project through the container API
        run: node scripts/container-smoke.mjs save
      - run: docker compose restart
      - name: Confirm the saved project survives restart
        run: node scripts/container-smoke.mjs verify
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
